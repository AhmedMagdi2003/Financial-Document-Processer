[project]
name = "impact-workspace"
version = "0.1.0"
description = "Independent financial document review and expense tracking workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
  "pymupdf>=1.25,<2", "pillow>=11,<13", "pycountry>=24.6",
  "langgraph>=1,<2", "langchain-openai>=1,<2",
  "langchain-google-genai>=4,<5", "langchain-xai>=1,<2", "langsmith>=0.14,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
demo = ["playwright>=1.50,<2", "imageio-ffmpeg>=0.6,<1", "edge-tts>=7,<8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Narration/caption source strings are intentionally written as complete subtitle lines.
"demo/scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

